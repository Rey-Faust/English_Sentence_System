<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>English Sentence System 3.2 AI</title>
<style>
:root {
 --bg:#f5f7fb; --surface:#fff; --text:#142033; --muted:#6b778c; --line:#dce3ec;
 --primary:#315efb; --primary2:#2448c8; --dark:#111827; --good:#16865c; --warn:#b7791f; --bad:#c23b3b;
 --shadow:0 14px 38px rgba(20,32,51,.08); --radius:18px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit} button{cursor:pointer}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:var(--dark);color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh}
.brand{font-weight:850;font-size:20px;margin:0 10px 5px} .brand-sub{font-size:12px;color:#94a3b8;margin:0 10px 24px;line-height:1.5}
.nav{display:grid;gap:7px} .nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 13px;border-radius:11px;font-weight:750}
.nav button:hover,.nav button.active{background:#263247;color:#fff}
.side-note{position:absolute;bottom:22px;left:26px;right:26px;color:#8290a7;font-size:11px;line-height:1.55}
main{padding:32px;max-width:1350px;width:100%;margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}
.eyebrow{font-size:11px;color:var(--primary);font-weight:850;letter-spacing:1.1px;text-transform:uppercase}
h1{font-size:30px;margin:5px 0 7px;letter-spacing:-.6px} .subtitle{color:var(--muted);line-height:1.65;max-width:800px}
.pill{padding:8px 11px;border-radius:999px;background:#eaf0ff;color:#2448c8;font-size:12px;font-weight:800;white-space:nowrap}
.grid{display:grid;gap:16px} .g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.metric .label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px} .metric .value{font-size:30px;font-weight:900;margin-top:6px} .metric .hint{font-size:11px;color:var(--muted);margin-top:4px}
.section-title{font-weight:850;font-size:17px;margin-bottom:5px} .section-note{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800} .primary{background:var(--primary);color:#fff} .primary:hover{background:var(--primary2)} .soft{background:#edf2ff;color:#274bc8} .ghost{background:#f2f4f7;color:#334155} .good{background:#eaf7f0;color:var(--good)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.field{display:grid;gap:6px} label{font-size:11px;font-weight:800;color:#475569}
input,select,textarea{width:100%;border:1px solid #cfd8e4;border-radius:11px;padding:11px 12px;background:#fff;color:var(--text);outline:none} textarea{min-height:105px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:#7391ff;box-shadow:0 0 0 3px rgba(49,94,251,.11)}
.pattern{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f3f6fa;border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.5}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff} .mini strong{display:block;font-size:13px;margin-bottom:4px} .mini span{font-size:11px;color:var(--muted);line-height:1.5}
.list{display:grid;gap:9px}
.structure-list{display:grid;grid-template-columns:repeat(3,1fr);gap:13px} .structure{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff;transition:.15s} .structure:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.head{display:flex;gap:10px;align-items:center;margin-bottom:11px} .num{width:29px;height:29px;border-radius:9px;background:#eaf0ff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.name{font-weight:850} .cn{font-size:11px;color:var(--muted)}
.tag{display:inline-flex;padding:5px 8px;border-radius:999px;background:#f2f4f7;color:#526071;font-size:10px;font-weight:800;margin:3px 3px 0 0}
.split{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}
.prompt{padding:17px;border:1px solid var(--line);border-radius:14px;background:#f8faff} .prompt-kicker{font-size:11px;color:var(--primary);font-weight:850;letter-spacing:.6px;text-transform:uppercase} .prompt-q{font-size:24px;font-weight:900;line-height:1.35;margin:5px 0} .prompt-hint{font-size:12px;color:var(--muted)}
.score-group{display:flex;gap:7px} .score{width:39px;height:39px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:850} .score.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
.progress{height:9px;background:#e7ecf3;border-radius:99px;overflow:hidden} .progress span{display:block;height:100%;background:var(--primary)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px} table{border-collapse:collapse;width:100%;min-width:820px;background:#fff} th,td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:top;line-height:1.5} th{background:#f7f9fc;font-size:10px;color:#667085;text-transform:uppercase;letter-spacing:.5px}
.timer{font-size:44px;font-weight:900;text-align:center;letter-spacing:-1px} .center{text-align:center}
.hidden{display:none!important}
.notice{padding:12px 14px;border-radius:11px;background:#fff7db;color:#785b00;font-size:12px;line-height:1.55}
.toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;padding:11px 14px;border-radius:11px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;font-size:12px} .toast.show{opacity:1;transform:none}
.mobile-nav{display:none}
@media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)} .structure-list{grid-template-columns:repeat(2,1fr)} .split{grid-template-columns:1fr}}
@media(max-width:760px){.app{display:block} .sidebar{display:none} main{padding:18px 13px 84px} .g4,.g3,.g2,.structure-list{grid-template-columns:1fr} .topbar{display:block} h1{font-size:26px}
.mobile-nav{display:flex;position:fixed;z-index:30;bottom:0;left:0;right:0;background:#111827;padding:7px;gap:3px;overflow-x:auto} .mobile-nav button{border:0;background:transparent;color:#cbd5e1;padding:9px 10px;border-radius:9px;white-space:nowrap;font-size:11px;font-weight:800} .mobile-nav button.active{background:#263247;color:#fff}
}

.ai-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#f8faff;margin-bottom:14px}
.api-status{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:#475569}
.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}.dot.ok{background:#16a34a}.dot.bad{background:#dc2626}
.feedback-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.feedback-score{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.feedback-score .k{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.feedback-score .v{font-size:22px;font-weight:900;margin-top:3px}
.ai-feedback{margin-top:14px;display:grid;gap:10px}
.feedback-block{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}
.feedback-block b{display:block;font-size:12px;margin-bottom:5px}
.feedback-block p{margin:0;color:#475569;font-size:12px;line-height:1.6;white-space:pre-wrap}
.feedback-block.goodbox{background:#f0fdf4;border-color:#bbf7d0}
.feedback-block.warnbox{background:#fffbea;border-color:#fde68a}
.feedback-block.bluebox{background:#eff6ff;border-color:#bfdbfe}
.settings-panel{margin-top:12px;border:1px dashed #cbd5e1;border-radius:12px;padding:13px;background:#fbfcfe}
.loading{opacity:.62;pointer-events:none}
.ai-question{font-size:25px;font-weight:900;line-height:1.35;margin:5px 0 3px}
.small-note{font-size:11px;color:var(--muted);line-height:1.55}
@media(max-width:760px){.feedback-grid{grid-template-columns:1fr}}

</style>
<script src="config.js"></script>
<script defer src="cloud.js"></script>
</head>

window.generateAIQuestion=async()=>{
 const m=current();
 const topic=document.getElementById('topic')?.value.trim()||'daily life';
 const scenario=document.getElementById('scenario')?.value.trim()||'general conversation';
 state.aiTopic=topic; state.aiScenario=scenario; save();
 const card=document.getElementById('practiceCard'); card?.classList.add('loading');
 try{
   const system=`You are an English speaking and thinking coach. The learner is practicing one logical sentence structure at a time.
Create exactly one practical question that naturally elicits the target structure. Make it specific enough to answer, but not overly complicated.
Return JSON only with keys: question, why_this_question.`;
   const user=`Target structure:
Function: ${m.Function}
Chinese label: ${m['中文']}
Core question: ${m['Core Question']}
Answer pattern: ${m['Core Answer Pattern']}
Core use: ${m['Core Use']}
Topic: ${topic}
Scenario: ${scenario}

Generate a fresh English practice question.`;
   const out=await deepseekJSON([{role:'system',content:system},{role:'user',content:user}]);
   state.aiQuestion=out.question||m['Core Question']; save(); render();
 }catch(e){toast(e.message); card?.classList.remove('loading')}
}

window.analyzeWithAI=async()=>{
 const m=current();
 const answer=document.getElementById('answer')?.value.trim();
 if(!answer) return toast('Write your answer first.');
 const question=state.aiQuestion||m['Core Question'];
 const topic=document.getElementById('topic')?.value.trim()||state.aiTopic||'';
 const scenario=document.getElementById('scenario')?.value.trim()||state.aiScenario||'';
 const card=document.getElementById('practiceCard'); card?.classList.add('loading');
 try{
   const system=`You are a rigorous but concise English coach for an intermediate learner.
Evaluate the learner's answer primarily on:
1) clarity of meaning,
2) fit to the target logical structure,
3) natural English,
4) precision.
Do NOT correct every minor issue. Surface only the 1-3 highest-value corrections.
Explicitly flag Chinese-influenced phrasing only when it is materially unnatural.
Give the learner a stronger natural version, but preserve their intended meaning.
Generate one natural follow-up question.
Return JSON only with this exact schema:
{
 "overall_score": 1-5,
 "clarity_score": 1-5,
 "structure_score": 1-5,
 "naturalness_score": 1-5,
 "what_worked": "...",
 "key_issue": "...",
 "why_it_matters": "...",
 "better_version": "...",
 "precision_upgrade": "...",
 "follow_up_question": "...",
 "micro_drill": "..."
}`;
   const user=`Target structure:
Function: ${m.Function}
Chinese label: ${m['中文']}
Core answer pattern: ${m['Core Answer Pattern']}
Expansion patterns: ${m['Expansion Patterns']}
Core use: ${m['Core Use']}

Practice question: ${question}
Topic: ${topic}
Scenario: ${scenario}
Learner answer: ${answer}

Evaluate this answer.`;
   const out=await deepseekJSON([{role:'system',content:system},{role:'user',content:user}]);
   renderAIResult(out,answer,m,question,topic,scenario);
 }catch(e){
   toast(e.message);
 }finally{card?.classList.remove('loading')}
}

function renderAIResult(out,answer,m,question,topic,scenario){
 const el=document.getElementById('aiResult');
 if(!el)return;
 const os=Math.max(1,Math.min(5,+out.overall_score||3));
 el.innerHTML=`<div class="ai-feedback">
 <div class="feedback-grid">
   <div class="feedback-score"><div class="k">Clarity</div><div class="v">${esc(out.clarity_score||'—')}/5</div></div>
   <div class="feedback-score"><div class="k">Structure Fit</div><div class="v">${esc(out.structure_score||'—')}/5</div></div>
   <div class="feedback-score"><div class="k">Naturalness</div><div class="v">${esc(out.naturalness_score||'—')}/5</div></div>
 </div>
 <div class="feedback-block goodbox"><b>What worked</b><p>${esc(out.what_worked||'')}</p></div>
 <div class="feedback-block warnbox"><b>Highest-value correction</b><p>${esc(out.key_issue||'')}</p><p style="margin-top:5px">${esc(out.why_it_matters||'')}</p></div>
 <div class="feedback-block bluebox"><b>Better natural version</b><p>${esc(out.better_version||'')}</p></div>
 <div class="feedback-block"><b>Precision upgrade</b><p>${esc(out.precision_upgrade||'')}</p></div>
 <div class="feedback-block"><b>Follow-up question</b><p>${esc(out.follow_up_question||'')}</p></div>
 <div class="feedback-block"><b>Micro drill</b><p>${esc(out.micro_drill||'')}</p></div>
 <div class="row">
   <button class="btn primary" id="saveFeedback">Save to Training Log</button>
   <button class="btn soft" id="practiceFollowup">Practice Follow-up</button>
 </div>
 </div>`;
 const feedback={score:os,clarity:out.clarity_score,structure:out.structure_score,naturalness:out.naturalness_score,better:out.better_version||'',precision:out.precision_upgrade||'',followup:out.follow_up_question||'',issue:out.key_issue||'',drill:out.micro_drill||'',answer,question,topic,scenario,id:m['#'],function:m.Function};
 document.getElementById('saveFeedback').onclick=()=>window.saveAIFeedback(JSON.stringify(feedback));
 document.getElementById('practiceFollowup').onclick=()=>window.useFollowUp(String(out.follow_up_question||''));
}
window.saveAIFeedback=async(packed)=>{
 if(window.savingFeedback)return;window.savingFeedback=true;
 try{
 const x=JSON.parse(packed);
 const record={
  date:new Date().toISOString(),id:x.id,function:x.function,topic:x.topic||'',scenario:x.scenario||'',
  answer:x.answer,answer2:'',precision:x.precision||'',score:x.score,status:x.score<=3?'Review':'Done',
  ai:true,aiClarity:x.clarity,aiStructure:x.structure,aiNaturalness:x.naturalness,aiIssue:x.issue,
  aiBetter:x.better,aiFollowup:x.followup,aiDrill:x.drill,question:x.question
 };
 const saved=await window.cloud.add(record);state.records.push(saved);
 document.getElementById('saveFeedback')?.setAttribute('disabled','');
 toast('已保存到云端 Training Log');
 }catch(e){toast('保存失败：'+e.message)}finally{window.savingFeedback=false}
}
window.useFollowUp=(q)=>{state.aiQuestion=q;save();render()}
window.nextWeak=()=>{const w=weak()[0];state.index=DATA.core.findIndex(x=>x['#']===w['#']);state.aiQuestion='';save();render()}
window.randomOne=()=>{state.index=Math.floor(Math.random()*DATA.core.length);state.aiQuestion='';save();render()}
window.speakQ=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(state.aiQuestion||current()['Core Question']);u.lang='en-US';speechSynthesis.speak(u)}}

function logPage(){
 const r=[...state.records].reverse();
 return `${header('HISTORY','Training Log','记录不是为了堆数据，而是为了找到长期重复出现的薄弱结构。','<button class="btn ghost" onclick="exportCSV()">Export CSV</button>')}
 <div class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Function</th><th>Topic / Scenario</th><th>Answer</th><th>Precision</th><th>Score</th><th>Status</th></tr></thead><tbody>${r.length?r.map(x=>`<tr><td>${new Date(x.date).toLocaleDateString()}</td><td><b>${esc(x.function)}</b>${x.ai?'<br><span class="tag">AI</span>':''}</td><td>${esc(x.topic||'')}<br><span style="color:#6b778c">${esc(x.scenario||'')}</span></td><td>${esc(x.answer)}</td><td>${esc(x.aiBetter||x.precision||'')}</td><td>${x.score}/5</td><td>${esc(x.status||'')}</td></tr>`).join(''):'<tr><td colspan="7">No records yet.</td></tr>'}</tbody></table></div>
 <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="clearLog()">Clear All</button></div></div>`;
}
window.exportCSV=()=>{if(!state.records.length)return toast('No records');const h=['Date','Function','Topic','Scenario','Answer','Follow-up Answer','Precision','Score','Status'];const rows=state.records.map(x=>[x.date,x.function,x.topic||'',x.scenario||'',x.answer,x.answer2||'',x.precision||'',x.score,x.status||'']);const csv=[h,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sentence_training_log.csv';a.click();URL.revokeObjectURL(a.href)}
window.clearLog=async()=>{if(confirm('删除账号下的全部训练记录？请先导出 CSV 备份。')){try{await window.cloud.clear();state.records=[];render()}catch(e){toast('删除失败：'+e.message)}}}

function progressPage(){
 const data=DATA.core.map(m=>{const s=stats(m['#']);return {m,...s}});
 return `${header('ANALYTICS','Progress & Weakness','低分 + 少练 = 高优先级。Mastered 定义：至少练 3 次且平均分 ≥ 4。')}
 <div class="card"><div class="table-wrap"><table><thead><tr><th>#</th><th>Structure</th><th>Layer</th><th>Attempts</th><th>Avg</th><th>Status</th><th>Progress</th></tr></thead><tbody>${data.map(x=>`<tr><td>${x.m['#']}</td><td><b>${esc(x.m.Function)}</b><br><span style="color:#6b778c">${esc(x.m['中文'])}</span></td><td>${esc(x.m.Layer)}</td><td>${x.count}</td><td>${x.count?x.avg.toFixed(1):'—'}</td><td>${x.count>=3&&x.avg>=4?'Mastered':x.count?'Training':'Not started'}</td><td><div class="progress"><span style="width:${Math.min(100,(x.count/3)*Math.min(1,x.avg/4)*100)}%"></span></div></td></tr>`).join('')}</tbody></table></div></div>`;
}

function grammarPage(){
 return `${header('SECONDARY REFERENCE','Question Grammar','Core 15 决定“思考什么关系”；Question Grammar 只负责“问题怎么问得语法正确”。')}
 <div class="card"><div class="table-wrap"><table><thead><tr><th>Type</th><th>功能</th><th>Structure</th><th>Example</th><th>Use</th><th>Scenario</th></tr></thead><tbody>${DATA.grammar.map(q=>`<tr><td><b>${esc(q['Question Type'])}</b></td><td>${esc(q['中文功能'])}</td><td><span class="pattern">${esc(q['结构'])}</span></td><td>${esc(q['Example'])}</td><td>${esc(q['主要用途'])}</td><td>${esc(q['高频场景'])}</td></tr>`).join('')}</tbody></table></div></div>`;
}

function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));document.getElementById('page').innerHTML=state.page==='core'?corePage():state.page==='practice'?practice():state.page==='log'?logPage():state.page==='progress'?progressPage():state.page==='grammar'?grammarPage():dashboard()}
render();
</script>
</body>
</html>
